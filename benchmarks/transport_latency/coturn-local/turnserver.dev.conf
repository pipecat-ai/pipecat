# coturn — LOCAL DEV config for the Pipecat transport-latency benchmark.
#
# Purpose: give SmallWebRTC a forced TURN relay hop on localhost so the
# "relayed" benchmark scenario is topology-symmetric with MoQ's moq-relay
# (client -> localhost relay container -> bot). See ../README.md.
#
# Run with ./run.sh (foreground docker run of the official coturn image).

listening-port=3478
# Small pinned relay range so Docker Desktop's -p mapping can cover it.
min-port=30000
max-port=30040

# Long-term credentials, fixed dev user (no TLS, no REST secret — dev only).
lt-cred-mech
user=pipecat:pipecat
realm=localhost
fingerprint

# The whole point is relaying between two processes on this machine:
# coturn denies loopback peers by default.
allow-loopback-peers
no-multicast-peers

# NOTE: external-ip is passed as a docker CLI arg in run.sh — the official
# image auto-detects and injects --external-ip unless one is given as an
# argument, and coturn rejects it being defined twice.

no-cli
no-tls
no-dtls
verbose
