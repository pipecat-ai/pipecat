# Each worker brings its own TTS and its own voice, so a hand-off is two
# workers speaking in turn: the outgoing one announces the transfer, then the
# incoming one answers in a different voice.
#
# They have to take turns. Handing off deactivates the current worker and
# activates the next, and the outgoing worker's pipeline is drained first so
# its announcement finishes before the newcomer starts. When they overlap, the
# answer lands inside the announcement and then starts again.
#
# Audio mode is required, not a preference: each child worker's LLM text goes
# to that worker's own TTS, so only the audio reaches the main worker.
name: acme_handoff_voices

user: !include user_audio.yaml
judge: !include judge_audio.yaml

turns:
  - expect:
      - event: response
        eval: "the bot welcomes the user to Acme Corp"

  - user: "Tell me about the Rocket Boots."
    expect:
      - event: function_call
        calls:
          - name: transfer_to_agent
            args: { agent: support }
      # The announcement has to stand on its own. When the two workers overlap
      # the answer lands inside it, so naming a product detail is what tells
      # the two apart.
      - event: response
        eval: "the bot says it is transferring or connecting the user to someone
          else, and has not yet given any product detail such as a price or a speed"
      - event: response
        eval: "the bot describes the Acme Rocket Boots, for example their price or their top speed"
      - event: response
        absent: true
        within_ms: 30000

  - user: "What else do you sell?"
    expect:
      - event: function_call
        calls:
          - name: transfer_to_agent
            args: { agent: greeter }
      - event: response
        eval: "the bot says it is transferring or connecting the user to someone else"
      - event: response
        eval: "the bot offers the Acme products for the user to choose from"

  # Terminal turn: end_conversation tears the pipeline down before any farewell
  # reaches the harness, so assert the call alone.
  - user: "That's everything, goodbye."
    expect:
      - event: function_call
        calls:
          - name: end_conversation
