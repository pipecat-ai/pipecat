name: capital_curious

# A curious caller works out one fact from the bot and hangs up. The persona
# LLM holds the conversation on its own; the judge decides from the whole
# conversation whether the caller got the answer, and scores the bot's manner.
# The smallest simulation that exercises the loop end to end, in text and in
# audio.

simulator: !include ../simulator.yaml

judge: !include ../judge_text.yaml

persona: |
  A friendly, curious traveler planning a trip to Europe. Polite and concise:
  asks one question at a time, and thanks the assistant once satisfied.

goal: "Find out what the capital of Germany is, then end the call."

success: "the bot told the caller that the capital of Germany is Berlin"

metrics:
  - name: politeness
    criterion: "the reply is courteous and helpful, never curt or dismissive"
    min_score: 1
  - name: brevity
    criterion: "the reply is at most three sentences, with no monologue"
  - measure: words
    max_value: 60

max_turns: 6

max_duration_s: 120

scenarios:
  # Text modality: the persona's turns go to the bot as text, and the judge
  # reads the LLM's text.
  - name: text

  # Audio modality: the persona's turns are synthesized and streamed to the
  # bot, and the bot's speech is transcribed for the persona to hear and for
  # the judge to read. Exercises the bot's STT, TTS, and turn taking against an
  # autonomous caller.
  - name: audio
    user: !include ../user_audio.yaml
    judge: !include ../judge_audio.yaml
    metrics:
      - name: politeness
        criterion: "the reply is courteous and helpful, never curt or dismissive"
        min_score: 1
      - name: brevity
        criterion: "the reply is at most three sentences, with no monologue"
      - measure: words
        max_value: 60
      - measure: latency
        max_value: 5
    max_duration_s: 180
