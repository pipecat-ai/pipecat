name: order_sushi

# Text modality, against flows/food_ordering_advanced_functionschema.py: the
# same ordering flow as order_pizza, built from explicit function schemas, with
# a caller who wants sushi.

simulator: !include simulator.yaml

judge: !include judge_text.yaml

persona: |
  Riley, ordering dinner. Casual and quick: wants three California rolls and
  confirms the order once it is read back correctly.

goal: "Order three California rolls and confirm the order."

success: "the bot took an order for three California rolls and completed the order"

metrics:
  - name: accuracy
    criterion: "the order the bot read back was three California rolls"
  - name: politeness
    criterion: "the bot stayed friendly and helpful throughout"

max_turns: 8
max_duration_s: 120
runs: 3
pass_threshold: 0.67
