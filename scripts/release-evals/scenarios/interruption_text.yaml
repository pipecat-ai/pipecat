name: interruption_text

# Text modality: the user barges in mid-response. The bot must drop the
# in-progress answer and respond to the new question (exercises interruption
# handling and context ordering). send_after fires 2s after the bot starts its
# long answer, so there's a real response to interrupt.

judge: !include judge_text.yaml

turns:
  # Wait for the bot's on-connect greeting before speaking (avoids barging into
  # it). The barge-in below anchors on the latest llm_started, which must be the
  # story's: anchored on the greeting's, the two user turns land as one and
  # nothing gets interrupted.
  - expect:
      - event: response
        eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

  - user: "Tell me a long, detailed story about the history of Paris."
    expect:
      - event: llm_started

  - user: "Actually, never mind that — what's the capital of Japan?"
    send_after:
      event: llm_started
      delay_ms: 2000
    expect:
      - event: bot_interrupted
      - event: response
        eval: "the response says the capital of Japan is Tokyo, instead of continuing the Paris story"
