name: function_call_timeout

# Text, end to end: a function call that hangs past the `timeout_secs` it was
# registered with. The deadline cancels the call, so the handler never returns
# its result — the bot has to report that the lookup didn't complete rather
# than a price it was never given. Needs a bot with a tool that sleeps well
# past its own timeout (see the function-calling-*-async examples).

judge: !include judge_text.yaml

turns:
  # Wait for the bot's on-connect greeting before speaking (avoids barging into it).
  - expect:
      - event: response
        eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

  - user: "What's the current share price of NVDA?"
    expect:
      - event: function_call
        calls:
          - name: get_stock_price

  # The lookup hangs, so its 5s deadline passes with nothing to report. A
  # timeout cancels the call without running the LLM, so the bot has nothing to
  # say until it's asked. Retrying is ruled out in the question: a second call
  # would hang the same way and reveal nothing new.
  - user: "Did that price lookup work? Don't try it again, just tell me what happened."
    send_after:
      delay_ms: 10000
    expect:
      - event: response
        eval: "says the price lookup did not succeed — it failed, timed out, was cancelled, or produced nothing — and does not quote a share price"

  # The cancelled handler would have returned a price around 20s in. Its result
  # is rejected, so nothing quotes a price inside this window.
  - expect:
      - event: response
        absent: true
        within_ms: 20000
