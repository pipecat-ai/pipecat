name: complete_patient_intake

# Text modality, against flows/patient_intake.py: a patient goes through the
# whole intake. The bot verifies the date of birth, then collects prescriptions,
# allergies, conditions, and the reason for the visit, reviews everything, and
# completes the intake. The judge reads the record_* and complete_intake calls
# along with the conversation.

simulator: !include ../scenarios/simulator.yaml

judge: !include ../scenarios/judge_text.yaml

persona: |
  Chad Bailey, a patient checking in for an appointment. Cooperative and brief:
  answers each question with just what was asked. Born January 1, 1983. Takes
  Lipitor, 20 milligrams. Allergic to penicillin. Has high blood pressure.
  Here for a routine checkup. Confirms the summary if it is correct.

goal: "Complete the intake: give the date of birth, prescriptions, allergies, conditions, and the reason for the visit, and confirm the summary."

success: "the bot completed the intake: it verified the date of birth, collected the prescriptions, allergies, conditions, and reason for the visit, reviewed them with the patient, and finished"

metrics:
  - name: accuracy
    criterion: "the information the bot reviewed with the patient matched what the patient said"
  - name: efficiency
    criterion: "the bot did not ask for the same information twice"

max_turns: 12
max_duration_s: 180
runs: 3
pass_threshold: 0.67
