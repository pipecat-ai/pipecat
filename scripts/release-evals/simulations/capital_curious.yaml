name: capital_curious

# Text modality: a curious caller works out one fact from the bot and hangs up.
# The persona LLM holds the conversation on its own; the judge decides from the
# whole conversation whether the caller got the answer, and scores the bot's
# manner. The smallest simulation that exercises the loop end to end.

persona: |
  A friendly, curious traveler planning a trip to Europe. Polite and concise:
  asks one question at a time, and thanks the assistant once satisfied.

goal: "Find out what the capital of Germany is, then end the call."

simulator:
  service: openai
  model: gpt-4o-mini

judge: !include ../scenarios/judge_text.yaml

success: "the bot told the caller that the capital of Germany is Berlin"

metrics:
  - name: politeness
    criterion: "the bot stayed courteous and helpful throughout"
  - name: brevity
    criterion: "the bot's replies were short enough for a phone call, with no long monologues"

max_turns: 6
max_duration_s: 120
