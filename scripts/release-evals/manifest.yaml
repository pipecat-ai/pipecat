  #
  # Realtime (speech-to-speech): one bot per provider, each exercising a
  # function call end to end inside the provider's own realtime session. These
  # are audio scenarios, audio being the modality these services consume.
  # Ultravox runs its async-tool example because that's the one with the
  # weather function the scenario expects.
  #
  - bot: realtime/realtime-aws-nova-sonic.py
    scenarios: [scripted/weather_function_call_audio]
  - bot: realtime/realtime-azure.py
    scenarios: [scripted/weather_function_call_audio]
  - bot: realtime/realtime-gemini-live.py
    scenarios: [scripted/weather_function_call_audio]
  - bot: realtime/realtime-grok.py
    scenarios: [scripted/weather_function_call_audio]
  - bot: realtime/realtime-inworld.py
    scenarios: [scripted/weather_function_call_audio]
  - bot: realtime/realtime-openai.py
    scenarios: [scripted/weather_function_call_audio]
  - bot: realtime/realtime-ultravox-async-tool.py
    scenarios: [scripted/weather_function_call_audio]

  #
  # Function calling: exercise one or more function calls.
  #
  - bot: getting-started/07-function-calling.py
    scenarios:
      - scripted/weather_function_call
      - scripted/weather_and_restaurant
  - bot: function-calling/function-calling-anthropic.py
    scenarios:
      - scripted/weather_function_call
      - scripted/weather_and_restaurant
  - bot: function-calling/function-calling-aws.py
    scenarios:
      - scripted/weather_function_call
      - scripted/weather_and_restaurant
  - bot: function-calling/function-calling-azure.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-baseten.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-cerebras.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-crusoe.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-deepseek.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-fireworks.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-google.py
    scenarios:
      - scripted/weather_function_call
      - scripted/weather_and_restaurant
  - bot: function-calling/function-calling-google-vertex.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-grok.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-groq.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-inception.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-mistral.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-nebius.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-novita.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-nvidia.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-openai.py
    scenarios: [scripted/weather_function_call]
  - bot: function-calling/function-calling-openai-responses.py
    scenarios:
      - scripted/weather_function_call
      - scripted/weather_and_restaurant
  - bot: function-calling/function-calling-openai-responses-http.py
    scenarios:
      - scripted/weather_function_call
      - scripted/weather_and_restaurant
  - bot: function-calling/function-calling-openrouter.py
    scenarios: [scripted/weather_function_call]
