      - weather_and_restaurant
  - bot: function-calling/function-calling-azure.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-baseten.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-cerebras.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-crusoe.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-deepseek.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-fireworks.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-google.py
    scenarios:
      - weather_function_call
      - weather_and_restaurant
  - bot: function-calling/function-calling-google-vertex.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-grok.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-groq.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-inception.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-mistral.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-nebius.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-novita.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-nvidia.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-openai.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-openai-responses.py
    scenarios:
      - weather_function_call
      - weather_and_restaurant
  - bot: function-calling/function-calling-openai-responses-http.py
    scenarios:
      - weather_function_call
      - weather_and_restaurant
  - bot: function-calling/function-calling-openrouter.py
