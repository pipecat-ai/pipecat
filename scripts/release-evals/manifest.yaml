  # Perplexity's completions API doesn't support tool calling, so this bot
  # answers from web-grounded search instead of invoking a function.
  - bot: function-calling/function-calling-perplexity.py
    scenarios: [weather_no_function_call]
  - bot: function-calling/function-calling-qwen.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-sambanova.py
    scenarios: [weather_function_call]
  - bot: function-calling/function-calling-sarvam.py
    scenarios: [weather_function_call]

  #
  # Async function calling: the tool keeps running after the LLM's turn ends
  # (cancel_on_interruption=False), so its result lands once the conversation has
  # moved on and the bot has to deliver it as an aside. The cancellation
  # scenarios go further and abandon work mid-flight, and these bots also carry a
  # share-price tool that hangs past its own timeout. Text except where the bot
  # has to be interrupted mid-sentence, which needs real speech to talk over.
  #
  - bot: function-calling/function-calling-anthropic-async.py
    scenarios:
      - async_tool_delivery
      - async_tool_deferred_delivery_audio
      - async_tool_cancellation
      - async_tool_cancellation_concurrent
      - function_call_timeout
  - bot: function-calling/function-calling-google-async.py
    scenarios:
      - async_tool_delivery
      - async_tool_deferred_delivery_audio
      - async_tool_cancellation
      - async_tool_cancellation_concurrent
      - function_call_timeout
  - bot: function-calling/function-calling-openai-async.py
    scenarios:
      - async_tool_delivery
      - async_tool_deferred_delivery_audio
      - function_call_timeout
      # gpt-4.1 answers that it is working on the report without calling
      # write_report, so neither cancellation scenario reaches what it tests.
      # - async_tool_cancellation
      # - async_tool_cancellation_concurrent
  - bot: function-calling/function-calling-openai-responses-async.py
    scenarios:
      - async_tool_delivery
      - async_tool_deferred_delivery_audio
      - async_tool_cancellation
      - async_tool_cancellation_concurrent
      - function_call_timeout

  #
  # Function calling with video: the bot calls a vision function that requests a
  # user image; the eval transport serves the scenario's `image:` for that turn.
  #
  - bot: function-calling/function-calling-openai-video.py
    scenarios: [describe_image]
  - bot: function-calling/function-calling-openai-responses-video.py
    scenarios: [describe_image]
  - bot: function-calling/function-calling-openai-responses-video-http.py
    scenarios: [describe_image]
  - bot: function-calling/function-calling-anthropic-video.py
    scenarios: [describe_image]
  - bot: function-calling/function-calling-aws-video.py
    scenarios: [describe_image]
  - bot: function-calling/function-calling-google-video.py
    scenarios: [describe_image]
  - bot: function-calling/function-calling-moondream-video.py
    scenarios: [describe_image]

  #
  # MCP: the bot's tools come from an MCP server instead of local functions.
  # The stdio bot spawns the reference memory server with npx (requires
  # Node.js — see the README prerequisites).
  #
  - bot: mcp/mcp-stdio.py
    scenarios: [mcp_memory]

  #
  # Vision: the bot is handed an image (a cat) on connect via --runner-body and
  # describes it. `runner_body:` is resolved relative to this manifest; relative
  # paths inside it (the image) resolve next to the body file.
  #
  - bot: vision/vision-openai.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]
  - bot: vision/vision-openai-responses.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]
  - bot: vision/vision-openai-responses-http.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]
  - bot: vision/vision-anthropic.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]
  - bot: vision/vision-aws.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]
  - bot: vision/vision-gemini-flash.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]
  - bot: vision/vision-moondream.py
    runner_body: scenarios/vision-cat.json
    scenarios: [vision_describe]

  #
  # Turn management: the user trails off mid-thought, then completes it after a
  # pause. The bot's incomplete-turn detection must hold the turn open and
  # respond only to the finished thought (anchored on the raw VAD stop signal).
  #
  - bot: turn-management/turn-management-filter-incomplete-turns.py
    scenarios: [filter_incomplete_turns]
  - bot: turn-management/turn-management-filter-incomplete-turns-function-calling.py
    scenarios: [filter_incomplete_turns_function_calling]
  - bot: turn-management/turn-management-filter-incomplete-turns-function-calling.py
    scenarios: [filter_incomplete_turns]

  #
  # Turn management: the user goes silent instead of trailing off. The bot's
  # idle handler asks the LLM for a check-in, and that response has to be spoken
  # even though no user speech preceded it.
  #
  - bot: turn-management/turn-management-filter-incomplete-turns-user-idle.py
    scenarios: [filter_incomplete_turns_user_idle]

  #
  # DTMF: the caller drives a keypad phone menu (IVR) with DTMF tones instead of
  # speech. The bot's DTMFAggregator turns each keypress into a transcription the
  # LLM responds to, so the harness can assert on the resulting transcription and
  # reply just like a spoken turn.
  #
  - bot: features/features-dtmf-menu.py
    scenarios: [dtmf_menu]

  #
  # Video avatar services
  #
  - bot: video-avatar/video-avatar-tavus-video-service.py
    scenarios: [capital_question]

  #
  # Flows: structured-conversation examples (examples/flows/). Text-only
  # scenarios asserting on node transitions, function calls, and context
  # strategies. The bots pick their LLM from $LLM_PROVIDER (default
  # openai_responses; hello_world always uses Google).
  #
  - bot: flows/hello_world.py
    scenarios: [hello_world]
  - bot: flows/food_ordering.py
    scenarios: [food_ordering_pizza]
  - bot: flows/food_ordering_advanced_functionschema.py
    scenarios: [food_ordering_sushi]
  - bot: flows/multi_worker_handoff.py
    scenarios: [multi_worker_handoff, multi_worker_handoff_back_and_forth]
  - bot: flows/patient_intake.py
    scenarios: [patient_intake]
  - bot: flows/restaurant_reservation.py
    scenarios: [restaurant_reservation_available, restaurant_reservation_no_availability]
  - bot: flows/insurance_quote.py
    scenarios: [insurance_quote]
  # Constructs and switches between OpenAI, Google, and Anthropic, so all
  # three API keys must be set.
  - bot: flows/llm_switching.py
    scenarios: [llm_switching]

  # Web search: the bot answers a current-events question by calling Keenable's
  # search tool, and reads a specific URL with its page-fetch tool.
  #
  - bot: features/features-keenable-web-search.py
    scenarios:
      - keenable_web_search
      - keenable_fetch_page
