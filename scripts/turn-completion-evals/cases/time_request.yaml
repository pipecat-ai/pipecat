# The user asks for time. The model must answer with ○ and nothing else.
category: time_request
cases:
  - name: time_hold_on
    turns:
      - bot: "If you could travel anywhere in the world right now, where would you go and why?"
      - user: "Hmm, hold on a second."
        expect: long

  - name: time_let_me_think
    turns:
      - bot: "If you could travel anywhere in the world right now, where would you go and why?"
      - user: "Let me think about that for a moment."
        expect: long

  - name: time_give_me_minute
    turns:
      - bot: "What would you say is your biggest strength?"
      - user: "Give me a minute to gather my thoughts."
        expect: long

  - name: time_checking_calendar
    turns:
      - bot: "What day works for your appointment?"
      - user: "One sec, let me check my calendar."
        expect: long

  - name: time_dont_answer_yet
    turns:
      - bot: "Hi! How can I help you today?"
      - user: "Wait, don't answer yet, I'm still deciding."
        expect: long

  - name: time_looking_it_up
    turns:
      - bot: "What's your account number?"
      - user: "Hang on, I have to look it up."
        expect: long
