name: Python Compatibility Test

on:
  push:
    branches: [main, develop]
    paths: ['pyproject.toml']
  pull_request:
    branches: [main, develop]
    paths: ['pyproject.toml']
  # Scheduled and manual runs ignore uv.lock and install the newest allowed
  # versions, as a user's fresh install would, so upstream releases that break
  # an install show up without any change here.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    name: Python ${{ matrix.python-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          # A stalled mirror keeps the connection alive well enough that apt's own
          # timeout never fires, so bound each attempt from outside and retry on a
          # fresh connection.
          for attempt in 1 2 3; do
            sudo timeout 90 apt-get update && break
            echo "apt-get update attempt $attempt timed out; retrying"
          done
          sudo timeout 300 apt-get install -y \
            portaudio19-dev \
            libcairo2-dev \
            libgirepository-2.0-dev \
            pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 'latest'
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv python pin ${{ matrix.python-version }}

      - name: Test uv sync with all extras
        run: |
          uv sync --group dev --all-extras ${{ github.event_name != 'push' && github.event_name != 'pull_request' && '--upgrade' || '' }}

      - name: Verify installation
        run: |
          uv run python --version
          uv run python -c "import pipecat; print('✅ Pipecat imports successfully')"
