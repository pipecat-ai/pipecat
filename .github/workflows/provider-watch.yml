name: Provider watch

# Weekly provider research: runs the /provider-watch skill, which researches
# every service unit, writes reports to pipecat-ai/provider-watch-reports, opens
# draft PRs here for clear-cut updates, and files a digest issue on the reports
# repo. The sweep fans out across matrix jobs — GitHub App installation tokens
# expire after one hour, so no single job can publish for longer than that; each
# group job finishes well inside its own token's hour, and a final job renders
# the digest once for everything.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated providers or unit ids (e.g. openai,deepgram/stt); empty = all"
        required: false
        type: string
      limit:
        description: "Research only the first N selected units"
        required: false
        type: string
      dry_run:
        description: "Dry run: push nothing, open nothing; reports are uploaded as an artifact"
        required: false
        type: boolean
        default: false

# One sweep at a time; a manual run waits for a scheduled one to finish.
concurrency:
  group: provider-watch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.groups.outputs.value }}
    steps:
      - name: Checkout pipecat
        uses: actions/checkout@v4

      # plan.py parses the services tree with ast, which needs the tree's own
      # Python generation; the runner default is not guaranteed to be it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Slice the units into groups
        id: groups
        run: |
          ONLY="${{ inputs.only }}"
          LIMIT="${{ inputs.limit }}"
          ARGS=(--json --group-size 12)
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          [ -n "$LIMIT" ] && ARGS+=(--limit "$LIMIT")
          GROUPS_JSON=$(python3 scripts/provider-watch/plan.py "${ARGS[@]}")
          echo "value=$GROUPS_JSON" >> "$GITHUB_OUTPUT"
          echo "Groups: $GROUPS_JSON"

  research:
    needs: plan
    runs-on: ubuntu-latest
    # A group must finish inside its App token's one-hour lifetime; the step
    # timeout cuts research off before publishing would start failing, and the
    # job timeout leaves room for the cleanup steps, which mint a fresh token.
    timeout-minutes: 70
    # Provider API keys live in this environment (deployment branch: main only).
    environment: provider-watch
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      # Half the groups at a time bounds the burst of concurrent researchers.
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: research (${{ matrix.group.name }})

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROVIDER_WATCH_APP_ID }}
          private-key: ${{ secrets.PROVIDER_WATCH_APP_PRIVATE_KEY }}
          owner: pipecat-ai
          repositories: |
            pipecat
            provider-watch-reports

      - name: Checkout pipecat
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout reports
        uses: actions/checkout@v4
        with:
          repository: pipecat-ai/provider-watch-reports
          token: ${{ steps.app-token.outputs.token }}
          path: _reports

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # The extras excluded here need system libraries or Apple hardware; the
        # same set is excluded by the Read the Docs build.
        run: |
          uv sync --group dev --all-extras \
            --no-extra gstreamer \
            --no-extra local \
            --no-extra local-smart-turn \
            --no-extra moondream \
            --no-extra mlx-whisper

      - name: Export provider credentials
        # Every environment/repository secret whose name appears in env.example
        # becomes an environment variable for the probes. Adding a provider key
        # to the environment is enough; the workflow needs no edit.
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          wanted = set(re.findall(r"^([A-Z][A-Z0-9_]*)=", open("env.example").read(), re.M))
          secrets = json.loads(os.environ["SECRETS_JSON"])
          exported = []
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in secrets.items():
                  if name in wanted and value:
                      delimiter = f"__PW_{name}__"
                      env_file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
                      exported.append(name)
          print(f"Exported {len(exported)} provider variables: {', '.join(sorted(exported))}")
          EOF

      - name: Configure git identity
        run: |
          for dir in . _reports; do
            git -C "$dir" config user.name "pipecat-provider-watch-bot[bot]"
            git -C "$dir" config user.email "321038859+pipecat-provider-watch-bot[bot]@users.noreply.github.com"
          done

      - name: Compose skill arguments
        id: args
        run: |
          ARGS="--non-interactive --no-finalize --only ${{ matrix.group.units }}"
          [ "${{ inputs.dry_run }}" != "true" ] && ARGS="$ARGS --publish"
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Running: /provider-watch $ARGS"

      - name: Run provider watch
        timeout-minutes: 55
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          # The provider-watch environment holds the bot's dedicated key,
          # shadowing the repo-level ANTHROPIC_API_KEY for this job.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Run the provider-watch skill unattended:

            /provider-watch ${{ steps.args.outputs.value }}

            Read `.claude/skills/provider-watch/SKILL.md` and follow it exactly,
            including its "Unattended runs" section. This job researches one
            group of a fanned-out sweep; a later job renders the digest, which
            is why the arguments include `--no-finalize`. The reports repo is
            checked out at `./_reports` on `main`; `gh` is authenticated with a
            token that can push to pipecat-ai/pipecat branches, open pull
            requests there, and push to pipecat-ai/provider-watch-reports. Use
            `$GITHUB_WORKSPACE/.pw-scratch` as the scratch directory.

            Without `--publish` this is a dry run: write reports into
            `./_reports` and leave branches locally, but push nothing and open
            nothing; a later workflow step uploads the results.
          claude_args: |
            --model claude-opus-5
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash,Agent,Task,WebFetch,WebSearch"

      - name: Regenerate app token for cleanup
        id: cleanup-token
        if: always() && inputs.dry_run != true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROVIDER_WATCH_APP_ID }}
          private-key: ${{ secrets.PROVIDER_WATCH_APP_PRIVATE_KEY }}
          owner: pipecat-ai
          repositories: |
            provider-watch-reports

      - name: Push any reports the run left behind
        # Covers both uncommitted files and commits whose push failed; the
        # run's original token may have expired, so this uses the fresh one.
        if: always() && inputs.dry_run != true
        working-directory: _reports
        run: |
          git remote set-url origin "https://x-access-token:${{ steps.cleanup-token.outputs.token }}@github.com/pipecat-ai/provider-watch-reports.git"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "provider-watch: $(date -u +%F) (uncommitted remainder)"
          fi
          if [ -n "$(git log --oneline @{u}..HEAD 2>/dev/null)" ]; then
            git pull --rebase --quiet && git push
          else
            echo "Nothing left to push."
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-watch-${{ github.run_id }}-${{ matrix.group.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            _reports/reports
            _reports/digests
            .pw-scratch/run.jsonl
            .pw-scratch/highlights.md

  digest:
    needs: [plan, research]
    # Renders the digest even when some groups failed; whatever they pushed is
    # in the reports repo and belongs in it.
    if: always() && needs.plan.result == 'success' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROVIDER_WATCH_APP_ID }}
          private-key: ${{ secrets.PROVIDER_WATCH_APP_PRIVATE_KEY }}
          owner: pipecat-ai
          repositories: |
            pipecat
            provider-watch-reports

      - name: Checkout pipecat
        uses: actions/checkout@v4

      - name: Checkout reports
        uses: actions/checkout@v4
        with:
          repository: pipecat-ai/provider-watch-reports
          token: ${{ steps.app-token.outputs.token }}
          path: _reports

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install PyYAML
        # publish.py needs only PyYAML here; the full project install is the
        # research jobs' concern.
        run: uv venv && uv pip install pyyaml

      - name: Configure git identity
        run: |
          git -C _reports config user.name "pipecat-provider-watch-bot[bot]"
          git -C _reports config user.email "321038859+pipecat-provider-watch-bot[bot]@users.noreply.github.com"

      - name: Download group highlights
        uses: actions/download-artifact@v4
        with:
          pattern: provider-watch-${{ github.run_id }}-*
          path: group-artifacts

      - name: Merge highlights
        run: |
          : > highlights.md
          for f in group-artifacts/*/.pw-scratch/highlights.md; do
            [ -f "$f" ] && { cat "$f"; echo; } >> highlights.md
          done
          cat highlights.md

      - name: Render the digest and open the issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          .venv/bin/python scripts/provider-watch/publish.py \
            --date "$(date -u +%F)" \
            --reports _reports \
            --repo-root . \
            --finalize \
            --highlights highlights.md
