name: license-check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_licenses.py"
      - ".github/workflows/license-check.yaml"
  pull_request:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_licenses.py"
      - ".github/workflows/license-check.yaml"

concurrency:
  group: license-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "Core dependency license check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "latest"
          enable-cache: false

      - name: Check core dependency licenses
        run: python3 scripts/check_licenses.py
