# One or two words that fully answer the question. The trap is treating
# brevity as incompleteness.
#
# Text modality; every scenario shares the judge below. A scenario's
# context: is the history the assistant aggregator would have left.

name: short_complete

judge: !include judge_text.yaml

scenarios:
- name: short_yes
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Would you like me to book that for you?
  turns:
  - user: Yes.
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
