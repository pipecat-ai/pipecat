# Function calling. A complete request that needs a tool should produce the
# call (● optional); a cut-off one must be ◐ with no call.
#
# Text modality; every scenario shares the judge below. A scenario's
# context: is the history the assistant aggregator would have left.

name: tools

judge: !include judge_text.yaml

scenarios:
- name: tool_weather_complete
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Hi! How can I help you today?
  turns:
  - user: What's the weather in Los Angeles right now?
    expect:
    - event: function_call
      calls:
      - name: get_current_weather
- name: tool_weather_complete_stt
  context:
  - role: developer
