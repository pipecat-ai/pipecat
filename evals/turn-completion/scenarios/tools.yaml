- name: tool_weather_cutoff
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Hi! How can I help you today?
  turns:
  - user: What's the weather in
    expect:
    - event: llm_marker
      marker: incomplete
      marker_first: true
      markers: 1
      text_after: false
    - event: function_call
      absent: true
      within_ms: 2000
