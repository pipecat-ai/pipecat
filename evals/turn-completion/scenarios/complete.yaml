# The user says something whole. The model must answer with ● and speech.
#
# Text modality; every scenario shares the judge below. A scenario's
# context: is the history the assistant aggregator would have left.

name: complete

judge: !include judge_text.yaml

scenarios:
- name: complete_answer_travel
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Let me start with a fun one. If you could travel anywhere in the world right now, where
      would you go and why?
  turns:
  - user: I'd go to Japan because I love the culture.
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
    - event: response
      eval: the reply engages with the user's wish to visit Japan
