    - event: llm_marker
      marker: incomplete
      marker_first: true
      markers: 1
      text_after: false
  - user: a flight to New York next week?
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
    - event: response
      eval: the reply takes up the request to book a flight to New York (offering to help, asking for
        details such as dates or the departure city, or explaining what it can do), rather than asking
        the user to finish their sentence
