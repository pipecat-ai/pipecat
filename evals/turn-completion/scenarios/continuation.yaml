# Multi-turn: a fragment, a ◐/○ in the context, then the user finishes. The
# model must answer the whole thought, not the last fragment.
#
# Text modality; every scenario shares the judge below. A scenario's
# context: is the history the assistant aggregator would have left.

name: continuation

judge: !include judge_text.yaml

scenarios:
- name: continuation_travel
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● If you could travel anywhere in the world right now, where would you go and why?
  turns:
  - user: I'd go to Japan because I love
    expect:
    - event: llm_marker
      marker: incomplete
      marker_first: true
      markers: 1
      text_after: false
  - user: the culture and the food.
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
    - event: response
      eval: the reply engages with the user wanting to visit Japan for its culture and food, rather than
        asking them to continue or finish their thought
