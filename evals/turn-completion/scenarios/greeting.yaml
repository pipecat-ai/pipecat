# No user content yet: the bot speaks first, or the user only says hello.
#
# Text modality; every scenario shares the judge below. A scenario's
# context: is the history the assistant aggregator would have left.

name: greeting

judge: !include judge_text.yaml

scenarios:
- name: greeting_user_hello
  turns:
  - user: Hello?
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
- name: greeting_user_hi_there
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Hi! How can I help you today?
  turns:
  - user: Hi there.
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
- name: greeting_are_you_there
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Hi! How can I help you today?
  turns:
  - user: Are you there?
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
