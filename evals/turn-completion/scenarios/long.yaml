# Long user turns: the marker has to be the first character no matter how
# much there is to respond to.
#
# Text modality; every scenario shares the judge below. A scenario's
# context: is the history the assistant aggregator would have left.

name: long

judge: !include judge_text.yaml

scenarios:
- name: long_complete_paragraph
  context:
  - role: developer
    content: The user has joined the conversation.
  - role: assistant
    content: ● Tell me about the project you're working on.
  turns:
  - user: So it's a voice agent for a dental office. Patients call in, the bot checks their insurance,
      finds an open slot, and books them. The hard part has been turn-taking, because people pause a lot
      when they're reading their insurance card, and the bot keeps jumping in. We tried a longer silence
      timeout but then it feels sluggish for everyone else. So now I'm looking at having the model itself
      decide whether the caller is done.
    expect:
    - event: llm_marker
      marker: complete
      marker_first: true
      markers: 1
      text_after: true
    - event: response
      eval: the reply engages with the dental-office voice agent and its turn-taking problem
- name: long_complete_paragraph_stt
