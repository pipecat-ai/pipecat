# Turn-completion evals manifest: one entry per model, all running the same
# scenario files. An entry's runner_body describes the LLM service bot.py
# builds; see the bot's module docstring for the fields. Providers that
# rate-limit concurrent connections cap their own concurrency.
#
# Run with ./run.sh (pipecat eval suite over this file); see README.md.

bots_dir: .
scenarios_dir: scenarios
concurrency: 8
runs_dir: test-runs
record: false
spawn: "{python} {bot} -t eval --port {port}"

# The tool scenarios need a model whose endpoint accepts tools; an entry whose
# body sets tools: false runs the other files instead.
scenario_files: &all
  - complete
  - continuation
  - cutoff
  - drift
  - greeting
  - hard
  - language
  - long
  - preamble
  - reprompt
  - short_complete
  - time_request
  - tools


scenario_files_no_tools: &no_tools
  - complete
  - continuation
  - cutoff
  - drift
  - greeting
  - hard
  - language
  - long
  - preamble
  - reprompt
  - short_complete
  - time_request

suite:
