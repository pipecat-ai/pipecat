# The code change takes long enough for two of the bot's own words while the
# user waits, neither claiming a result. Also the control for
# wait_reassurance_declined, which is this timeline with a decline after the
# first word.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Fix the flaky retry test in the HTTP client."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is starting on the fix, without claiming the fix is already done; speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"
      check_from: turn_start  # some models say it before the delegate call

# No user turn: the first word.
- expect:
    - event: response
      within_ms: 20000
      eval: "says, unprompted, that it is still working on the task, in one or two short sentences; may name the step under way or one just done (a change applied, tests started), but no file names, commands or code, and not what was found; does not report the task's outcome or say the task is finished; asks nothing and promises nothing; speaks as itself, without mentioning a backend"
      allow_continue: false
      text_excludes: "backend"

# No user turn: the second.
- expect:
    - event: response
      within_ms: 20000
      eval: "says, unprompted, that it is still working on the task, in one or two short sentences; may name the step under way or one just done (a change applied, tests started), but no file names, commands or code, and not what was found; does not report the task's outcome or say the task is finished; asks nothing and promises nothing; speaks as itself, without mentioning a backend"
      allow_continue: false
      text_excludes: "backend"

- expect:
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass (if the bot only reports progress or says the work is still underway, answer continue, not no: the report has not come yet)"
