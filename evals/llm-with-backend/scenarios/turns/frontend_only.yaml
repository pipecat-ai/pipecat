# A question the frontend answers itself: nothing here needs the backend.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "What does a mutex do?"
  expect:
    - event: response
      eval: "explains what a mutex does (it lets one thread or process at a time hold a lock on a shared resource)"
    - event: function_call
      absent: true
      within_ms: 5000
