# The user asks up front not to be kept posted: the bot decides to say nothing
# while the fix is in progress, then the result.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Fix the flaky retry test in the HTTP client. No need to keep me posted, just tell me when it's done."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is starting on the fix, without claiming the fix is already done; speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"
      check_from: turn_start  # some models say it before the delegate call
    # The bot's next decision, once the wait has run: the silent mark, which
    # the LLM service reports as it drops the reply unspoken. A model may
    # acknowledge once more after its delegate call first; the marker check
    # looks past that.
    - event: llm_marker
      marker: silent
      within_ms: 25000

- expect:
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass (if the bot only reports progress or says the work is still underway, answer continue, not no: the report has not come yet)"
