# The user asked to be kept posted in detail, so the bot's own word while the
# fix is in progress names what is being done, drawn from the backend's silent
# progress messages.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Fix the flaky retry test in the HTTP client, and keep me posted with the details as you go: I want to know exactly what you're doing."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is starting on the fix, without claiming the fix is already done; speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"
      check_from: turn_start  # some models say it before the delegate call

# No user turn: the bot's own word, with detail.
- expect:
    - event: response
      within_ms: 20000
      eval: "says, unprompted, what is being done on the fix at the moment: a concrete step such as searching the code, reading a file, patching a file or running the tests, with a file or function name where there is one; reports no result and does not say the work is done; speaks as itself, without mentioning a backend"
      allow_continue: false
      text_excludes: "backend"

- expect:
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass (if the bot only reports progress or says the work is still underway, answer continue, not no: the report has not come yet)"
