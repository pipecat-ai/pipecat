# While the backend works, the user asks how it is going. The bot answers from
# the backend's silent progress messages. (A second delegate call cannot be
# asserted absent: the backend's own calls are reported as function_call
# events too.)
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Fix the flaky retry test in the HTTP client."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is starting on the fix"

- user: "How's it going with that?"
  send_after:
    delay_ms: 8000
  expect:
    - event: response
      within_ms: 25000
      eval: "describes what is being done on the fix at the moment (such as searching or reading the code, patching a file, or running the tests) rather than only a generic 'still working on it'"

- expect:
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass (if the bot only reports progress or says the work is still underway, answer continue, not no: the report has not come yet)"
