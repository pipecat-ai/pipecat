# After the bot's first word, the user asks not to be kept posted: the bot
# acknowledges, then decides to say nothing until the result.
# wait_reassurance_repeats is the control: the same timeline without the
# decline gets a second word where this one gets the silent decision.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Fix the flaky retry test in the HTTP client."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is starting on the fix, without claiming the fix is already done; speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"
      check_from: turn_start  # some models say it before the delegate call

# No user turn: the first word.
- expect:
    - event: response
      within_ms: 20000
      eval: "says, unprompted, that it is still working on the task, in one or two short sentences; may name the step under way or one just done, but no file names, commands or code; reports no finding or result and does not say the work is done; asks nothing and promises nothing; speaks as itself, without mentioning a backend"
      allow_continue: false
      text_excludes: "backend"

# The remark's text arrives before it is spoken, so the decline is held until a
# listener would have heard the remark out.
- user: "No need to keep me posted, just tell me when you're done."
  send_after: { delay_ms: 8000 }
  expect:
    # On the LLM's text, like the silent decision below, so the one is not read
    # into the other.
    - event: llm_response
      within_ms: 25000
      eval: "agrees to report when the work is done, briefly, without reporting a result; speaks as itself, without mentioning a backend"
      allow_continue: false
      text_excludes: "backend"
    # The bot's next decision, once the wait has run again: the silent mark,
    # dropped unspoken, at the end of the LLM's text. The LLM's text carries
    # the mark, so this is what the harness sees of silence.
    - event: llm_response
      text_contains: "∅"
      text_matches: "(^\\s*|[.!?]\\s*)∅\\s*$"
      within_ms: 25000

- expect:
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass (if the bot only reports progress or says the work is still underway, answer continue, not no: the report has not come yet)"
