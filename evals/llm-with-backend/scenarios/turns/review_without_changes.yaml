# A review is not a request for a change. The backend reads and reports;
# it changes nothing until the user asks, and says so when asked.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Give me a quick code review of PR 418, the exponential backoff one, and tell me what you'd flag."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is looking at the code (an acknowledgement is enough: answer yes); speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"

- expect:
    - event: response
      within_ms: 120000
      eval: "reports review findings about the retry backoff change (such as what the current code does, what to check, or missing test coverage) and does not say it changed, patched, implemented or fixed anything (answer no if it says a change was applied; if it only says it is still reviewing, answer continue, not no)"

- user: "Did you change any code?"
  expect:
    - event: response
      within_ms: 25000
      eval: "says that no code was changed (answer no if it says something was changed, patched or fixed)"
