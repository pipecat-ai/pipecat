# Work handed to the backend: the bot acknowledges at once, then reports the
# result on its own when the backend is done.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Can you fix the flaky retry test in the HTTP client for me?"
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 15000
      eval: "acknowledges that it is starting on the fix, without claiming the fix is already done"

# No user turn: the backend's report arrives on its own.
- expect:
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass, mentioning the HTTP client, the backoff, or the test by name"
