# While the backend works, the user asks how it is going, and none of the
# backend's progress is in the frontend's context: the bot's connector
# records only spoken messages. With nothing to answer from, the bot says it
# has no update yet rather than describing work it cannot see, and still
# reports the fix when it lands.
- expect:
    - event: response
      eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

- user: "Fix the flaky retry test in the HTTP client."
  expect:
    - event: function_call
      calls:
        - name: delegate
    - event: response
      within_ms: 25000
      eval: "acknowledges that it is starting on the fix; speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"
      check_from: turn_start  # some models say it before the delegate call

- user: "How's it going with that?"
  send_after:
    delay_ms: 8000
  expect:
    - event: response
      within_ms: 25000
      eval: "says there is no update yet, or that it is still working on the fix, without claiming a concrete step it cannot know (reading a particular file, applying a patch, running the tests) and without reporting a result; speaks as itself, without mentioning a backend or handing work off"
      text_excludes: "backend"

- expect:
    - event: function_call
      within_ms: 150000
      calls:
        - name: apply_patch
      check_from: turn_start  # the backend's call, in its own time
    - event: function_call
      within_ms: 150000
      calls:
        - name: run_tests
      check_from: turn_start  # the backend's call, in its own time
    - event: response
      within_ms: 150000
      eval: "reports that the retry test was fixed and the tests now pass (if the bot only reports progress or says the work is still underway, answer continue, not no: the report has not come yet)"
