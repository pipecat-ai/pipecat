# LLMWithBackend evals: the example bots and the behaviors they must show.
# Run with: pipecat eval suite evals/llm-with-backend/manifest.yaml
#
# The conversations live once, in scenarios/turns/, and are included by a
# text and an audio scenario file each. Text mode drives the cascade bot only
# and is the fast loop; audio mode runs against every bot and is the
# judgment. See README.md.

bots_dir: ../../examples/multi-worker/llm-with-backend
scenarios_dir: scenarios
concurrency: 2
runs_dir: test-runs
record: true
spawn: "{python} {bot} -t eval --port {port}"

suite:
  - bot: openai-responses-frontend.py
    scenarios:
      - text/frontend_only
      - text/delegate_ack
      - text/delegate_with_aside
      - text/concurrent_delegations
      - text/superseding_delegation
      - text/cancel_delegation
      - text/cancel_and_replace
      - text/implicit_cancel
      - text/partial_cancel
      - text/progress_inquiry
      - text/aside_while_waiting
      - text/accepted_offer
      - text/wait_reassurance
      - text/wait_reassurance_repeats
      - text/wait_reassurance_detail_requested
      - text/wait_reassurance_declined
      - text/wait_reassurance_declined_upfront
      - audio/frontend_only
      - audio/delegate_ack
      - audio/delegate_with_aside
      - audio/concurrent_delegations
      - audio/superseding_delegation
      - audio/cancel_delegation
      - audio/cancel_and_replace
      - audio/implicit_cancel
      - audio/partial_cancel
      - audio/progress_inquiry
      - audio/aside_while_waiting
      - audio/result_during_interruption
      - audio/accepted_offer
