name: expression_tagger

# Expressive conversation with a tagger: the LLM writes plain words, a tagger
# after it writes the expression tags, and the TTS performs them rather than
# speaking them. Each turn checks that the LLM's raw text has no tag, that
# the TTS performed a tag, and that neither the text the TTS reports speaking
# nor the transcription of the bot's audio has markup. The evals judge only
# the reply's content. The checks of what the TTS performed and spoke read
# from the turn's start: a service without word timestamps reports its text
# before the LLM's reply is complete.
#
# For a bot with PipelineParams(enable_expressive_conversation=True), a
# tagger such as PipecatToneTagger between the LLM and the TTS, and an
# expression policy with ExpressionGuidance.MATCH_STYLE, such as
# examples/expressive-conversation/expressive-conversation-tone-tagger.py.

user: !include ../user_audio.yaml

judge: !include ../judge_audio.yaml

scenarios:
  - name: expression_tagger
    turns:
      # Wait for the bot's on-connect greeting before speaking (avoids barging into it).
      - expect:
          - event: response
            eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

      - user: "I just found out I got the job I interviewed for last month!"
        expect:
          - event: llm_response
            text_excludes: "<<"
          - event: expression
            check_from: turn_start
            text_contains: "<<"
          - event: tts_response
            check_from: turn_start
            eval: "the bot congratulates the user"
            text_excludes: "<"
          - event: response
            eval: "the bot congratulates the user"
            text_excludes: "emotion"

      - user: "Thanks. But my dog has been sick all week and I'm really worried about him."
        expect:
          - event: llm_response
            text_excludes: "<<"
          - event: expression
            check_from: turn_start
            text_contains: "<<"
          - event: tts_response
            check_from: turn_start
            eval: "the bot responds with sympathy for the user's worry about their dog"
            text_excludes: "<"
          - event: response
            eval: "the bot responds with sympathy for the user's worry about their dog"
            text_excludes: "emotion"
