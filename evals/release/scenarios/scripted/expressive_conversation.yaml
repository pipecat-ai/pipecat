name: expressive_conversation

# Expressive conversation, end to end: the LLM writes expression tags into
# its replies, and the TTS performs them rather than speaking them. Each turn
# checks the LLM's raw text for a tag, the expression the TTS performed (a tag
# the TTS can't perform is never reported), the text the TTS reports speaking
# for mode markup (events are reported there as they are performed), and the
# transcription of the bot's audio for tags read aloud. Markup
# is checked by text_excludes. The evals judge only the reply's content: a
# judge asked about markup finds it in the LLM's raw text and fails replies
# that were spoken cleanly. The checks of what the TTS performed and spoke
# read from the turn's start: a service without word timestamps reports its
# text before the LLM's reply is complete.
#
# For a bot with PipelineParams(enable_expressive_conversation=True) whose
# prompt teaches the tags, such as the examples in
# examples/expressive-conversation/.

user: !include ../user_audio.yaml

judge: !include ../judge_audio.yaml

scenarios:
  - name: expressive_conversation
    turns:
      # Wait for the bot's on-connect greeting before speaking (avoids barging into it).
      - expect:
          - event: response
            eval: "the bot opens the conversation in some way (a greeting, an introduction, an offer to help, or a question to get the user started)"

      - user: "I just found out I got the job I interviewed for last month!"
        expect:
          - event: llm_response
            text_contains: "<<"
          - event: expression
            check_from: turn_start
            text_contains: "<<"
          - event: tts_response
            check_from: turn_start
            eval: "the bot congratulates the user"
            text_excludes: "<"
          - event: response
            eval: "the bot congratulates the user"
            text_excludes: "emotion"

      - user: "Thanks. But my dog has been sick all week and I'm really worried about him."
        expect:
          - event: llm_response
            text_contains: "<<"
          - event: expression
            check_from: turn_start
            text_contains: "<<"
          - event: tts_response
            check_from: turn_start
            eval: "the bot responds with sympathy for the user's worry about their dog"
            text_excludes: "<"
          - event: response
            eval: "the bot responds with sympathy for the user's worry about their dog"
            text_excludes: "emotion"

      - user: "Why did the scarecrow win an award? Because he was outstanding in his field."
        expect:
          # Each TTS names its laugh its own way, as an event or a mode.
          - event: llm_response
            eval: "the reply laughs with a tag, such as [[laughter]], [[laughs]], [[chuckles]] or <<laughing>>"
          # [[laughter]], [[chuckling]] or <<laughing>>, as the TTS performed it.
          - event: expression
            check_from: turn_start
            eval: "the bot laughs or chuckles, as an event or a mode"
          - event: tts_response
            check_from: turn_start
            eval: "the bot reacts to the user's joke"
            text_excludes: "<"
          - event: response
            eval: "the bot reacts to the user's joke"
            text_excludes: "emotion"
