name: rime_prism_audio
user:
  modality: audio
  speech:
    service: kokoro
    voice: af_heart
    sample_rate: 16000
judge:
  modality: audio
  eval:
    factory: evals.judges.typesafe_classifier
    explainer: false
  transcription:
    service: moonshine
    model: small-streaming
scenarios:
  - name: multi_turn
    turns:
      - expect:
          - event: response
            eval: The assistant greets the user or offers help.
      - user: My name is Alex. Please remember my name.
        expect:
          - event: response
            eval: The assistant acknowledges the name Alex.
      - user: What is my name, and what is the capital of Germany?
        expect:
          - event: response
            eval: The assistant says the user is named Alex and the capital of Germany is Berlin.
  - name: barge_in_and_next_turn
    turns:
      - expect:
          - event: response
      - user: Tell me a very long story about Paris, at least six hundred words.
        expect:
          - event: llm_started
      - user: Stop that story. What is the capital of Japan? Give a short answer.
        send_after:
          event: llm_started
          delay_ms: 1500
        expect:
          - event: bot_interrupted
          - event: response
            eval: The assistant answers that the capital of Japan is Tokyo.
      - user: What is the capital of France?
        expect:
          - event: response
            eval: The assistant says the capital of France is Paris.
  - name: tools_and_handoff
    turns:
      - expect:
          - event: response
      - user: Remember that my invoice number is 123.
        expect:
          - event: response
      - user: Look up the payment status of the invoice number I gave you.
        expect:
          - event: function_call
            name: lookup_invoice
            args:
              invoice_id: '123'
          - event: response
            text_contains: paid
      - user: Transfer me to billing support.
        expect:
          - event: function_call
            name: transfer_to_billing
          - event: response
      - user: Which department handles this conversation now?
        expect:
          - event: response
            text_contains: Billing support
