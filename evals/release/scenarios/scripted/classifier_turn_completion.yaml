name: classifier_turn_completion

# Audio modality. A classifier, not the LLM, decides whether the user's turn
# is complete. The user trails off mid-thought and the bot must stay quiet;
# after a short pause the user finishes the sentence and the bot answers the
# whole thought. There are no LLM markers here: the LLM runs only when the
# classifier says the turn is complete, so the checks are on what the bot
# says and when.
#
# The completion is anchored on the raw VAD stop signal
# (vad_user_stopped_speaking): the turn-level user_stopped_speaking is held
# back while the turn is open.

user: !include ../user_audio.yaml

judge: !include ../judge_audio.yaml

scenarios:
  - name: classifier_turn_completion
    turns:
      - expect:
          - event: response
            eval: "the bot opens the conversation in some way (a greeting, an introduction, or a question inviting the user to respond)"

      # The user trails off. VAD sees the pause, the classifier says the turn
      # is not complete, and no response follows for a while.
      - user: "Let me think about it, hmmm"
        expect:
          - event: vad_user_stopped_speaking
          - event: response
            absent: true
            within_ms: 2500

      # The user finishes the thought under the short timeout. Now the bot
      # answers the whole answer, not the fragment.
      - user: "I'd go to Japan."
        send_after:
          event: vad_user_stopped_speaking
          delay_ms: 3000
        expect:
          - event: response
            eval: "the response engages with the user's answer about visiting Japan, for example by commenting on it or asking a follow-up question about it"
