# Minimal Kamailio registrar + proxy for the SIP bot example.
#
# Run with the official image:
#
#   docker run -d --name kamailio -p 5060:5060/udp -p 5060:5060/tcp \
#     -v "$(pwd)/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro" \
#     kamailio/kamailio:5.8-alpine
#
# The config is intentionally minimal: no digest auth (add the auth
# module and www_challenge() for production), no TLS, no dispatcher.
# NAT handling matters in practice because the bot registers from behind
# NAT: its Contact carries its own view of its address while packets
# arrive from a NAT-received address. fix_nated_register() records the
# received address on the contact, and handle_ruri_alias() uses it when
# relaying an INVITE to the bot.

####### Modules #########

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"

####### Parameters #########

# Keep registrations in memory; a restart drops them and bots re-register
# within reg_interval seconds. Use db_mode=1 with a database in production.
modparam("usrloc", "db_mode", 0)

# AOR matching is by username only; the domain part is not compared.
modparam("usrloc", "use_domain", 0)

# fix_nated_register() stores the NAT-received address in an AVP that must
# match registrar's received_avp, so lookup() can place the R-URI alias.
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

# One contact per AOR keeps the table clean across restarts.
modparam("registrar", "max_contacts", 1)

####### Routing Logic #########

request_route {
    # In-dialog requests (BYE, re-INVITE) relay along the Record-Route
    # recorded at call setup.
    if (has_totag()) {
        t_relay();
        exit;
    }

    if (is_method("REGISTER")) {
        # Responses and future server-to-bot requests must reach the bot
        # through NAT, so advertise and record the NAT-received address.
        force_rport();
        fix_nated_register();
        if (!save("location")) {
            sl_reply_error();
            exit;
        }
        exit;
    }

    if (is_method("INVITE")) {
        # Route to whoever registered the R-URI user. On a hit, relay to
        # the NAT-received address recorded at registration. On a miss,
        # 480 tells the caller no agent is available.
        if (lookup("location")) {
            record_route();
            handle_ruri_alias();
            t_relay();
            exit;
        }
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}
