# The insurance quote flow as data. Loaded by bot.py and joined to the tools in
# handlers.py. The quote_results node reads the current quote from the manager's
# state; update_coverage leads back to the same node, which is rendered again
# with the new figures.

initial_node: initial

nodes:
  initial:
    role_message: >-
      You are a friendly insurance agent. Your responses will be converted to
      audio, so avoid special characters. Always use the available functions to
      progress the conversation naturally.
    task_messages:
      - role: developer
        content: Start by asking for the customer's age.
    functions:
      - name: collect_age
        transition_to: marital_status

  marital_status:
    task_messages:
      - role: developer
        content: Ask about the customer's marital status for premium calculation.
    functions:
      - name: collect_marital_status
        transition_to: quote_calculation

  quote_calculation:
    task_messages:
      - role: developer
        content: >-
          Calculate a quote for a {{ age }} year old {{ marital_status }}
          customer. First, call calculate_quote with their information. Then
          explain the quote details and ask if they'd like to adjust coverage.
    functions:
      - name: calculate_quote
        transition_to: quote_results

  quote_results:
    task_messages:
      - role: developer
        content: |
          Quote details:
          Monthly Premium: ${{ quote.monthly_premium }}
          Coverage Amount: ${{ quote.coverage_amount }}
          Deductible: ${{ quote.deductible }}

          Explain these quote details to the customer. When they request changes,
          use update_coverage to recalculate their quote. Explain how their
          changes affected the premium and compare it to their previous quote.
          Ask if they'd like to make any other adjustments or if they're ready
          to end the quote process.
    functions:
      - name: update_coverage
        transition_to: quote_results
      - name: end_quote
        transition_only: true
        description: Complete the quote process when the customer is satisfied.
        transition_to: end

  end:
    task_messages:
      - role: developer
        content: >-
          Thank the customer for their time and end the conversation. Mention
          that a representative will contact them about the quote.
    post_actions:
      - type: end_conversation
